name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
        exclude:
          - os: macos-latest # gcc is an alias for clang there
            cc: gcc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make CC=${{ matrix.cc }} all
      - run: make CC=${{ matrix.cc }} test
      - run: make CC=${{ matrix.cc }} example

  sanitize:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: make CC=${{ matrix.cc }} sanitize

  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make CC=gcc mutants

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make CC=gcc coverage | tee -a "$GITHUB_STEP_SUMMARY"

  embedded-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - run: make size | tee -a "$GITHUB_STEP_SUMMARY"

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make CC=gcc bench | tee -a "$GITHUB_STEP_SUMMARY"
